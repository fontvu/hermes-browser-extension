name: Sync upstream

on:
  schedule:
    - cron: "0 6 * * 1"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  sync-upstream:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Merge upstream/main into main
        id: merge
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git remote add upstream https://github.com/abundantbeing/hermes-browser-extension.git
          git fetch upstream main
          if git merge --no-edit upstream/main; then
            echo "clean=true" >> "$GITHUB_OUTPUT"
          else
            echo "clean=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Push clean merge
        if: steps.merge.outputs.clean == 'true'
        run: git push origin HEAD:main

      - name: Open PR on conflict
        if: steps.merge.outputs.clean == 'false'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git merge --abort
          git reset --hard origin/main
          BR="upstream-sync/conflict-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          git checkout -b "$BR"

          if git merge --no-edit upstream/main; then
            git push origin HEAD:main
            exit 0
          fi

          git add -A
          if git diff --cached --quiet; then
            echo "Merge reported conflicts, but no staged changes were found to preserve." >&2
            exit 1
          fi

          git commit -m "WIP: upstream sync with conflicts" --no-verify
          git push --set-upstream origin "$BR"
          gh api \
            --method POST \
            -H "Accept: application/vnd.github+json" \
            "repos/${GITHUB_REPOSITORY}/pulls" \
            -f base=main \
            -f head="$BR" \
            -f title="Upstream sync needs manual resolution" \
            -f body="Scheduled weekly upstream merge hit conflicts. Resolve manually, then merge this PR."
